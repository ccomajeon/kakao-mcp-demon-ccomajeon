# Local test setup. Run from the repository root:
#   docker compose -f docker/compose.yaml up -d --build
# Guide: docs/runbooks/docker.md
name: kakao-mcp

services:
  kakao-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kakao-mcp:local
    container_name: kakao-mcp
    # A refused login (another PC session, expired token) makes the daemon exit. Stop after three
    # failed restarts instead of retrying forever; check `dc logs` before starting it again.
    restart: on-failure:3
    init: true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "kakao-health"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    volumes:
      - kakao-data:/data
    ports:
      # Web GUI only, and only on this computer's loopback. The MCP port (8787) is never published.
      - "127.0.0.1:8899:18899"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kakao-data:
