name: publish

# Publish the npm package from a version tag on main with npm trusted publishing (OIDC): no npm token is
# stored in the repository. A manual run from the default branch only packs and checks
# (`npm publish --dry-run`); it never publishes.
#
# The build job installs dependencies, runs the checks and packs the tarball with read-only access and
# no npm cache. Only the publish job can request an OIDC token, and it runs no project code or
# dependency scripts: it downloads the packed tarball and publishes exactly that file.
# Actions are pinned to full commit SHAs; to update one, resolve the new release tag with
# `git ls-remote https://github.com/actions/<name> refs/tags/<tag>` and replace the SHA and comment.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Tag matches package.json and is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG is not on main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:publication
      - run: npm run check:package
      # npm refuses even a dry run of a version it already has, so a manual run between releases packs a
      # throwaway prerelease version. The change stays in the runner and is never committed or published.
      - name: Use a throwaway prerelease version for a manual run
        if: github.ref_type != 'tag'
        env:
          RUN_ID: ${{ github.run_id }}
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dryrun.$RUN_ID"
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package" && sha256sum ./*.tgz | tee SHA256SUMS
      - name: Dry run
        if: github.ref_type != 'tag'
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --access public --tag dryrun --dry-run --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The `npm` environment is where the person adds a required reviewer, so no tag publishes without approval.
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global --ignore-scripts npm@11.21.0
      - name: Publish the tarball built and checked above
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd package
          sha256sum --check --strict SHA256SUMS
          tarball="kakao-mcp-ccomajeon-${TAG#v}.tgz"
          test -f "$tarball"
          npm publish "./$tarball" --access public --ignore-scripts
