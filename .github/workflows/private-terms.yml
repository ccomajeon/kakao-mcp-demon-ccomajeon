name: private-terms

# An optional KAKAO_MCP_DENYLIST secret adds maintainer-specific terms to public checks.
# pull_request_target runs the base branch's scanner on the PR's commits as data: it never checks out
# or runs PR code. The deny list goes only to pull requests from this repository's own branches and to
# pushes. A fork author controls the scanned text and can read the log, so a fork PR is checked with
# the public patterns only; the scanner never prints which maintainer term matched or where, only a count.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-terms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Fetch the pull request's commits as data
        if: github.event_name == 'pull_request_target'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
      - name: Scan the pull request's commits, title and description (maintainer list)
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          KAKAO_MCP_DENYLIST: ${{ secrets.KAKAO_MCP_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-private-terms.mjs --text-env PR_TITLE --text-env PR_BODY --commits "$HEAD" --not "$BASE"
      - name: Scan a fork pull request's commits, title and description (public patterns only)
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-private-terms.mjs --text-env PR_TITLE --text-env PR_BODY --commits "$HEAD" --not "$BASE"
      - name: Scan pushed commits and the whole tree
        if: github.event_name == 'push'
        env:
          KAKAO_MCP_DENYLIST: ${{ secrets.KAKAO_MCP_DENYLIST }}
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/check-private-terms.mjs --tree HEAD
          node scripts/check-private-terms.mjs --commits HEAD --not "$BEFORE"
